<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Columns Utilities</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; padding: 2rem; }
    .demo-item { margin: 0.5rem; padding: 0.75rem 1rem; border: 1px solid #ccc; border-radius: 4px; }
    .dark body { background: #1a1a1a; color: #eee; }
    .dark .demo-item { border-color: #444; }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-item cols-1">.cols-1</div>
  <div class="demo-item cols-2">.cols-2</div>
  <div class="demo-item cols-3">.cols-3</div>
  <div class="demo-item cols-4">.cols-4</div>
  <div class="demo-item cols-5">.cols-5</div>
  <div class="demo-item cols-6">.cols-6</div>
</body>
</html>
