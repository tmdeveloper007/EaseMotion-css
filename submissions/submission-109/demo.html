<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>EaseMotion CSS - Animations</title>
  <style>
    body{font-family:system-ui,sans-serif{max-width:900px{margin:0 auto{padding:2rem{background:#f9fafb{
    h1{color:#1f2937{font-size:1.75rem{margin-bottom:0.5rem{
    p{color:#6b7280{line-height:1.6{margin-bottom:2rem{
    .grid{display:grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr)){gap:1.5rem{
    .card{background:white{border-radius:12px{padding:1.5rem{box-shadow:0 2px 8px rgba(0,0,0,0.08){text-align:center{
    .box{width:80px{height:80px{background:linear-gradient(135deg,#667eea,#764ba2){border-radius:8px{margin:0 auto 1rem{display:flex{align-items:center{justify-content:center{color:white{font-weight:bold{font-size:1.5rem{
    code{background:#f3f4f6{padding:0.2em 0.4em{border-radius:4px{font-size:0.875em{
  </style>
</head>
<body>
  <h1>EaseMotion CSS Animations</h1>
  <p>Zero-dependency animation library with readable class names.</p>
  <div class="grid">
    <div class="card"><div class="box ease-fade-in">1</div><code>ease-fade-in</code></div>
    <div class="card"><div class="box ease-scale-in">2</div><code>ease-scale-in</code></div>
    <div class="card"><div class="box ease-slide-up">3</div><code>ease-slide-up</code></div>
    <div class="card"><div class="box ease-bounce-in">4</div><code>ease-bounce-in</code></div>
    <div class="card"><div class="box ease-zoom-in">5</div><code>ease-zoom-in</code></div>
    <div class="card"><div class="box ease-pulse">6</div><code>ease-pulse</code></div>
    <div class="card"><div class="box ease-glow">7</div><code>ease-glow</code></div>
    <div class="card"><div class="box ease-spin">8</div><code>ease-spin</code></div>
  </div>
</body>
</html>
